name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/api-ecommerce
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/frontend-ecommerce

jobs:

  # =============================================
  # 1. Secret Scanning
  # =============================================
  gitleaks:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: 
            fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =============================================
  # 2. SAST
  # =============================================
  sast:
    name: 2. SAST com Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs


  # =============================================
  # 3. Lint & Code Quality
  # =============================================
  lint:
    name: 3. Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Lint
        run: echo "✅ Lint & Code Quality - etapa ignorada temporariamente."


  # =============================================
  # 4. Test
  # =============================================
  tests:
    name: 4. Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ============================================================
  # 5. Docker Build + Trivy + Push api
  # ============================================================
  docker-build-trivy:
    name: 5. Docker Build & Trivy Scan
    runs-on: ubuntu-latest

    needs: 
      - gitleaks
      - sast
      - lint
      - tests
    
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t ecommerce-image:${{ github.sha }} .

      - name: Run Trivy - Docker image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: 'ecommerce-image:${{ github.sha }}'
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker tag ecommerce-image:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/api-ecommerce:${{ github.sha }}
          docker tag ecommerce-image:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/api-ecommerce:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/api-ecommerce:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/api-ecommerce:latest

  
  # ============================================================
  # 6. Docker Build + Push Frontend
  # ============================================================
  frontend-build:
    name: 6. Docker Build & Push Frontend
    runs-on: ubuntu-latest

    needs: 
      - gitleaks
      - sast
      - lint
      - tests
    
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build andPush Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
        
  # ============================================================
  # 7. Terraform IaC Scan
  # ============================================================  
  iac-scan:
    name: 7. Terraform IaC Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Trivy configuration scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          hide-progress: false
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'


  # ============================================================
  # 8. DAST - OWASP ZAP
  # ============================================================ 
  dast-scan:
    name: 8. DAST com OWASP ZAP
    runs-on: ubuntu-latest
    needs:
      - docker-build-trivy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------------------
      # Criar rede Docker
      # ------------------------------------
      - name: Create Docker Network
        run: docker network create dast-network

      # ------------------------------------
      # PostgreSQL
      # ------------------------------------
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name dast-postgres \
            --network dast-network \
            -e POSTGRES_DB=${{ secrets.DB_NAME }} \
            -e POSTGRES_USER=${{ secrets.DB_USER }} \
            -e POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }} \
            postgres:16-alpine

      # ------------------------------------
      # Aguardar PostgreSQL
      # ------------------------------------
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec dast-postgres \
              pg_isready \
              -U ${{ secrets.DB_USER }} \
              -d ${{ secrets.DB_NAME }} > /dev/null 2>&1; then

              echo "PostgreSQL is ready!"
              exit 0
            fi

            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

          echo "PostgreSQL did not become ready in 60 seconds."
          exit 1

      # ------------------------------------
      # Redis
      # ------------------------------------
      - name: Start Redis
        run: |
          docker run -d \
            --name dast-redis \
            --network dast-network \
            redis:7-alpine

      # ------------------------------------
      # Aguardar Redis
      # ------------------------------------
      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if docker exec dast-redis \
              redis-cli ping | grep -q PONG; then
              echo "Redis is ready!"
              exit 0
            fi

            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

          echo "Redis did not become ready in 60 seconds."
          exit 1

      # --------------------------------------------------------
      # Construir imagem da API
      # --------------------------------------------------------
      - name: Build Docker Image for DAST
        run: |
          docker build \
            -t ecommerce-image:${{ github.sha }} .

      # --------------------------------------------------------
      # Iniciar API
      # --------------------------------------------------------
      - name: Start Application for DAST
        run: |
          docker run -d \
            --name dast-api \
            --network dast-network \
            -p 3000:3000 \
            -e NODE_env=development \
            -e PORT=3000 \
            -e DB_HOST=dast-postgres \
            -e DB_PORT=5432 \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_POOL_MIN=2 \
            -e DB_POOL_MAX=10 \
            -e REDIS_HOST=dast-redis \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD= \
            -e REDIS_DB=0 \
            -e RATE_LIMIT_WINDOW_MS=900000 \
            -e RATE_LIMIT_MAX_REQUESTS=100 \
            ecommerce-image:${{ github.sha }}


      # --------------------------------------------------------
      # Verificar aplicação
      # --------------------------------------------------------
      - name: Verify Application is Running
        run: |
          echo "=== Docker containers ==="
          docker ps
          sleep 5

          echo "=== Application Logs ==="
          docker logs dast-api

      - name: Wait for API
        run: |
          echo "Waiting for API to be ready..."
          until curl --fail --silent http://localhost:3000/health; do
            sleep 2
          done

          echo
          echo "API is ready!"

      - name: Show API documentation
        run: |
          curl --fail http://localhost:3000/api-docs.json

      # --------------------------------------------------------
      # OWASP ZAP
      # --------------------------------------------------------
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
