name: Pipeline CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*

  pull_request:
    branches:
      - main
      - develop
      - feature/*

jobs:

  # =============================================
  # 1. Secret Scanning
  # =============================================
  gitleaks:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: 
            fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3


  # =============================================
  # 2. SAST
  # =============================================
  sast:
    name: 2. SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs


  # =============================================
  # 3. Lint & Code Quality
  # =============================================
  lint:
    name: 3. Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
            node-version: 24
            cache: npm

      - name: Install dependencies
        run: npm run lint