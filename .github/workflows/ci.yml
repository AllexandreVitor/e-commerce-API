name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - feature/*

  pull_request:
    branches:
      - main
      - develop
      - feature/*

jobs:

  # =============================================
  # 1. Secret Scanning
  # =============================================
  gitleaks:
    name: 1. Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with: 
            fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =============================================
  # 2. SAST
  # =============================================
  sast:
    name: 2. SAST com Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs


  # =============================================
  # 3. Lint & Code Quality
  # =============================================
  lint:
    name: 3. Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Lint
        run: echo "✅ Lint & Code Quality - etapa ignorada temporariamente."


  # =============================================
  # 4. Test
  # =============================================
  tests:
    name: 4. Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ============================================================
  # 5. Docker Build + Trivy + Push
  # ============================================================
  docker-build-trivy:
    name: 5. Docker Build & Trivy Scan
    runs-on: ubuntu-latest

    needs: 
      - gitleaks
      - sast
      - lint
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t ecommerce-app:latest .

      # TEMPORÁRIO: vamos verificar as dependências
      # dentro da MESMA imagem que o Trivy irá analisar
      - name: Inspect image dependencies
        run: |
          docker run --rm ecommerce-app:latest npm ls brace-expansion ip-address tar --all

      - name: Run Trivy - Docker image
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: ecommerce-app:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
